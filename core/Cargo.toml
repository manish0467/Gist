[package]
name = "gist-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "gist_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
native-tls = "0.2"
imap = "2.4"
mail-parser = "0.9"
